<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Policy Modal - Kerassentials</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Padrão Ouro: Fundo ancorado no TOPO */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        @media (max-width: 768px) {
            body {
                background-image: url('bg-m.jpg');
                background-position: top center;
            }
        }

        /* Padrão Ouro: Overlay escuro */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* --- Modal Compacto (Padrão Ouro) --- */
        .cookie-modal {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            padding: 25px 25px 20px 25px;
            text-align: center;
            color: #1a2a3a;
            position: relative;
            z-index: 1;
        }

        .cookie-modal h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* --- CORES EXTRAÍDAS DA IMAGEM (Item 3) --- */
        /* Caixa de texto usando o verde menta da base da imagem */
        .cookie-text-box {
            background-color: #a8d5c9; /* Cor extraída da parte inferior da imagem */
            border-radius: 12px;
            padding: 18px 15px;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 13px;
            color: #1e224b; /* Usei o azul escuro no texto para manter contraste */
        }

        .cookie-text-box p {
            margin-bottom: 6px;
        }

        .cookie-text-box p:last-child {
            margin-bottom: 0;
        }

        .cookie-text-box strong {
            color: #1a2a3a;
        }

        .cookie-divider {
            width: 35px;
            height: 2px;
            background-color: #d0d7de;
            margin: 0 auto 18px auto;
            border-radius: 2px;
        }

        .cookie-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn-cookie {
            flex: 1;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Botão ALLOW usando o azul escuro/roxo profundo do topo da imagem */
        .btn-allow {
            background-color: #1e224b; 
            color: #ffffff;
            border: 2px solid #1e224b;
        }
        .btn-allow:hover {
            background-color: #121532;
            border-color: #121532;
        }

        /* Botão CLOSE com borda no azul escuro extraído */
        .btn-close {
            background-color: #ffffff;
            color: #1e224b;
            border: 2px solid #1e224b;
        }
        .btn-close:hover {
            background-color: #f0f1f8;
        }

        .cookie-footer {
            font-size: 11px;
            color: #8a9aa8;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .cookie-modal { max-width: 90%; padding: 20px; }
            .cookie-actions { flex-direction: column; gap: 8px; }
            .btn-cookie { width: 100%; padding: 12px; }
        }
    </style>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y63nduz43w");
    </script>
    
</head>
<body>

    <!-- Modal de Cookies Compacto -->
    <div class="cookie-modal">
        <h2>Cookie Policy</h2>
        
        <div class="cookie-text-box">
            <p>We use cookies to improve your experience and analyze traffic.</p>
            <p>By clicking <strong>"Allow"</strong> or <strong>"Close"</strong>, you consent to our use of cookies.</p>
            <p>You can change preferences anytime.</p>
        </div>

        <div class="cookie-divider"></div>

        <div class="cookie-actions">
            <!-- Links atualizados para a nova URL -->
            <a href="https://www.checkout-ds24.com/redir/533765/vipacheco/" class="btn-cookie btn-allow">Allow</a>
            <a href="https://www.checkout-ds24.com/redir/533765/vipacheco/" class="btn-cookie btn-close">Close</a>
        </div>

        <div class="cookie-footer">
            Your privacy is important to us.
        </div>
    </div>

</body>
</html>
